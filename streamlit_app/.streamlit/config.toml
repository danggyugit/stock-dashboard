[theme]
primaryColor = "#3B82F6"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
# Streamlit 메뉴(View source / Settings / Print 등) 최소화
# minimal: 햄버거 메뉴 숨김, "Manage app" 등 host UI 숨김
toolbarMode = "minimal"
