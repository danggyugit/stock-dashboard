name: Update Valuation Cache

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to refresh"
        required: true
        default: "sp500"
        type: choice
        options:
          - sp500     # ~12 min, 500 tickers
          - sp1500    # ~37 min, 1500 tickers (weekly)

  schedule:
    # Daily 03:00 UTC (12:00 KST) — S&P 500 (~12 min)
    - cron: "0 3 * * *"
    # Sunday 04:00 UTC (13:00 KST) — full S&P 1500 (~37 min)
    - cron: "0 4 * * 0"

permissions:
  contents: write

jobs:
  update-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml curl_cffi

      - name: Determine universe
        id: pick
        run: |
          # Sunday cron → sp1500, weekday/manual → use input or default sp500
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "universe=${{ github.event.inputs.universe }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 4 * * 0" ]; then
            echo "universe=sp1500" >> $GITHUB_OUTPUT
          else
            echo "universe=sp500" >> $GITHUB_OUTPUT
          fi

      - name: Build valuation cache
        run: |
          UNIVERSE="${{ steps.pick.outputs.universe }}"
          echo "Building $UNIVERSE valuation cache..."
          cd streamlit_app
          python scripts/build_valuation_cache.py --universe $UNIVERSE --sleep 0.8

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streamlit_app/data/cache/valuation/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            UNIVERSE="${{ steps.pick.outputs.universe }}"
            git commit -m "chore: refresh valuation cache ($UNIVERSE) [skip ci]"
            git push
          fi
